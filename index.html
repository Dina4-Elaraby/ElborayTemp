<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElBoray Integration Solution – Company Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- <link rel="stylesheet" href="elboray.css"> -->
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="profilelogo.jpeg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: #061a2b;
        }

        .coming-soon {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coming-soon img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 100vh;
            object-fit: contain;
        }

        /* Mobile screens */
        @media (max-width: 768px) {
            .coming-soon {
                min-height: 100svh;
            }

            .coming-soon img {
                width: 100%;
                height: auto;
                max-height: none;
            }
        }
    </style>
</head>

<body>
    <div class="coming-soon">
        <img
            src="WhatsApp Image 2026-10-24 at 11.08.02 PM.jpeg" alt="Elboray Integrated Solutions - Coming Soon"
        >
    </div>
</body>
</html>
